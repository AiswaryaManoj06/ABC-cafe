<div class="cafe-container">
  <!-- Counter Component: Heading, DatePipe, Customer Name Input & Ask Order Button -->
  <app-counter
    [(customerName)]="customerName"
    (askOrder)="askOrder($event)"
  />

  <!-- Order Inquiry Process: Shown when inquiry is active -->
  <ng-container *ngIf="orderInquiryActive">
    <!-- Order Inquiry Component: Prompts customer and dynamically replaces [customerName] -->
    <app-order-inquiry
      [customerName]="customerName"
    />

    <!-- Beverage Selection Component: Conditionally displayed via *ngIf, uses *ngFor for beverages -->
    <app-beverage-selection
      *ngIf="orderInquiryActive"
      [beverages]="beverages"
      [(selectedBeverage)]="selectedBeverage"
      (beverageSelected)="onBeverageSelect($event)"
    />

    <!-- Order Placement Component: "Place Order" button that adds selected beverage to orders -->
    <app-order-placement
      *ngIf="orderInquiryActive"
      [customerName]="customerName"
      [selectedBeverage]="selectedBeverage"
      [customerOrders]="customerOrders"
      (orderPlaced)="onOrderPlaced($event)"
    />
  </ng-container>

  <!-- Order Summary Component: Displayed only if there are orders, uses UpperCasePipe for formatting -->
  <app-order-summary
    *ngIf="customerOrders.length > 0"
    [customerOrders]="customerOrders"
  />
</div>
