<div class="cafe-container">
  <!-- Top Bar: Button to toggle Performance Component -->
  <div class="cafe-toolbar">
    <button
      type="button"
      class="btn-perf-toggle"
      (click)="togglePerformance()"
    >
      <span>{{ showPerformance ? '✕ Hide Performance' : '📊 View Cafe Performance' }}</span>
    </button>
  </div>

  <!-- Performance Component (Shown on clicking the button) -->
  <app-performance
    *ngIf="showPerformance"
    (close)="showPerformance = false"
  />

  <!-- Counter Component: Heading, DatePipe, Customer Name Input & Ask Order Button -->
  <app-counter
    [(customerName)]="customerName"
    (askOrder)="askOrder($event)"
  />

  <!-- Order Inquiry Process: Shown when inquiry is active -->
  <ng-container *ngIf="orderInquiryActive">
    <!-- Order Inquiry Component: Prompts customer and dynamically replaces [customerName] -->
    <app-order-inquiry
      [customerName]="customerName"
    />

    <!-- Beverage Selection Component: Conditionally displayed via *ngIf, uses *ngFor for beverages -->
    <app-beverage-selection
      *ngIf="orderInquiryActive"
      [beverages]="beverages"
      [(selectedBeverage)]="selectedBeverage"
      (beverageSelected)="onBeverageSelect($event)"
    />

    <!-- Order Placement Component: "Place Order" button that adds selected beverage to orders -->
    <app-order-placement
      *ngIf="orderInquiryActive"
      [customerName]="customerName"
      [selectedBeverage]="selectedBeverage"
      [customerOrders]="customerOrders"
      (orderPlaced)="onOrderPlaced($event)"
    />
  </ng-container>

  <!-- Customer Review Component: Displayed when Consumed button is clicked -->
  <app-customer-review
    *ngIf="showCustomerReview"
    [order]="activeOrderDescription || lastOrderDescription"
    [(isVisible)]="showCustomerReview"
    (reviewSubmitted)="onReviewSubmitted($event)"
  />

  <!-- Order Summary Component: Displays orders with Consumed buttons -->
  <app-order-summary
    *ngIf="customerOrders.length > 0"
    [customerOrders]="customerOrders"
    (orderConsumed)="onOrderConsumed($event)"
  />
</div>
